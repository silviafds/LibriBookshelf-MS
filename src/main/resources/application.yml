spring:
  application:
    name: Libri Bookshelf MS

  config:
    activate:
      on-profile: default

  docker:
    compose:
      enabled: false

  main:
    web-application-type: servlet

  datasource:
    url: jdbc:postgresql://localhost:5435/libri-bookShelf
    username: user
    password: "123"
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8081
  servlet:
    context-path: /

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/